<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>404 Not Found | Trainspotters Int'l</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #fff;
      color: #212529;
    }

    .navbar {
      border-bottom: 1px solid #e9ecef;
    }

    .navbar-brand {
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: -0.01em;
      color: #212529 !important;
      text-decoration: none;
      gap: 0.4rem;
    }

    footer {
      border-top: 1px solid #e9ecef;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      color: #e9ecef;
    }
  </style>
</head>

<body>
  <nav class="navbar bg-white py-2">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <i class="bi bi-train-front-fill"></i>
        <span>Trainspotters Int'l</span>
      </a>
    </div>
  </nav>

  <main class="flex-grow-1 container py-5 text-center d-flex flex-column align-items-center justify-content-center">
    <p class="error-code mb-0">404</p>
    <p class="text-muted small text-uppercase fw-semibold mb-3 mt-2">Page Not Found</p>
    <h1 class="h2 fw-bold mb-3">We couldn't find that page.</h1>
    <p class="text-muted mb-5 mx-auto" style="max-width:480px">
      The page you were looking for doesn't exist. It may have been moved, deleted, or the URL might be incorrect.
    </p>
    <a href="/" class="btn btn-dark btn-lg px-5">
      <i class="bi bi-house me-2"></i>Back to Home
    </a>
  </main>

  <footer class="py-4 bg-white">
    <div class="container text-center">
      <p class="small text-muted mb-0">
        Made with <i class="bi bi-heart-fill text-danger"></i> at Le Wagon
      </p>
    </div>
  </footer>
</body>

</html>
