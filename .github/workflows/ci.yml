name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install JS deps
        run: yarn install --immutable

      - name: Install yamllint
        run: pip install --quiet yamllint

      - name: JS checks
        run: |
          yarn lint
          yarn lint:css
          yarn format
          yarn typecheck
          yarn audit:js

      - name: YAML lint
        run: yamllint .

      - name: Ruby checks
        run: |
          bundle exec standardrb
          bundle exec erblint --lint-all
          bundle exec erb-format --check app/views/**/*.html.erb
          bundle exec brakeman -q
          bundle exec bundle-audit check --update

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: trainspotters_intl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d trainspotters_intl_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/trainspotters_intl_test
      SECRET_KEY_BASE: dummy

    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - name: Enable Corepack
        run: corepack enable

      - name: Restore Yarn cache
        uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-

      - name: Install JS deps
        run: yarn install --immutable

      - name: Compile assets
        env:
          RAILS_ENV: production
          NODE_ENV: production
        run: bundle exec rails assets:precompile

      - name: Prepare DB
        run: bundle exec rails db:prepare

      - name: Run tests
        run: bundle exec rails test
